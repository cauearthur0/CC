name: Verificar fontes

# Abre cada página de agenda (fontes fixas da cidade ou endereços informados) e mostra o que dá
# para ler dela. Serve para conferir se uma fonte nova funciona antes de colocá-la em cities.json.
on:
  workflow_dispatch:
    inputs:
      city:
        description: "Cidade (slug). Vazio = todas."
        required: false
        default: ""
      urls:
        description: "Endereços para testar no lugar das fontes da cidade (separados por espaço)."
        required: false
        default: ""
      follow:
        description: "Abrir também as matérias ligadas que falam de crianças (só para os endereços acima)."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ler as fontes
        env:
          CITY: ${{ github.event.inputs.city }}
          URLS: ${{ github.event.inputs.urls }}
          FOLLOW: ${{ github.event.inputs.follow }}
        run: |
          args=()
          [ -n "$CITY" ] && args+=(--city "$CITY")
          for url in $URLS; do args+=(--url "$url"); done
          [ "$FOLLOW" = "true" ] && args+=(--follow)
          node scripts/check-sources.mjs "${args[@]}"
